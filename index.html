<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Template Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#17202e;--mute:#667085;--line:#dde2ea;--acc:#1d4ed8;--acc-ink:#fff;--mark:#fde68a;--markink:#5b4300;--miss:#fee2e2;--missink:#991b1b;--r:10px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--panel:#171e29;--ink:#e8edf5;--mute:#93a0b4;--line:#2a3443;--acc:#6ea0ff;--acc-ink:#0b1220;--mark:#5b4a12;--markink:#fde9a3;--miss:#4a1f24;--missink:#fecaca}}
:root[data-theme="dark"]{--bg:#0f141c;--panel:#171e29;--ink:#e8edf5;--mute:#93a0b4;--line:#2a3443;--acc:#6ea0ff;--acc-ink:#0b1220;--mark:#5b4a12;--markink:#fde9a3;--miss:#4a1f24;--missink:#fecaca}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;max-width:1200px;margin:0 auto}
aside{padding:20px 14px;border-right:1px solid var(--line)}
h1{font-size:19px;margin:0 6px 4px;letter-spacing:-.01em}
.sub{margin:0 6px 18px;color:var(--mute);font-size:13px}
.svc{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500}
.svc:hover{background:var(--line)}
.svc.on{background:var(--acc);color:var(--acc-ink)}
.svc small{margin-left:auto;opacity:.7}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.bad{color:var(--missink)}
.btn.sm{padding:4px 9px;font-weight:500}
.ghost{width:100%;margin-top:10px;border-style:dashed;background:none;color:var(--mute)}
main{padding:20px 24px 40px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 13px;border-radius:99px;cursor:pointer;font-weight:500;font-size:14px}
.chip.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);font-weight:700}
.chip.add{border-style:dashed;color:var(--mute);background:none}
.head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.head h2{margin:0;font-size:18px}
.tag{font-size:12px;color:var(--mute);margin-left:6px;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg)}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:14px;color:var(--mute);font-weight:600}
label{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
.fld{margin-bottom:12px}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
textarea{min-height:260px;resize:vertical;line-height:1.55}
.hint{font-size:12px;color:var(--mute);margin:4px 0 0}
.pv{white-space:pre-wrap;word-break:break-word;line-height:1.65}
.pv .subj{font-weight:700;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
mark{background:var(--mark);color:var(--markink);border-radius:4px;padding:0 3px}
mark.miss{background:var(--miss);color:var(--missink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.vars button{border:0;background:var(--mark);color:var(--markink);padding:3px 9px;border-radius:99px;cursor:pointer;font-size:13px}
.row{display:flex;gap:8px}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
#modal{position:fixed;inset:0;background:rgba(10,15,25,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.open{display:flex}
#modal .box{background:var(--panel);border-radius:14px;padding:20px;width:min(440px,100%);border:1px solid var(--line)}
#modal h3{margin:0 0 12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.cols{grid-template-columns:1fr}main{padding:16px 14px 40px}#svcs{display:flex;flex-wrap:wrap;gap:4px}.svc{width:auto}.ghost{width:auto;margin:0}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Template Hub</h1>
    <p class="sub">Write once. Fill in the blanks. Send.</p>
    <div id="svcs"></div>
    <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn sm" data-a="backup">Backup</button>
      <button class="btn sm" data-a="restore">Restore</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var KEY="templatehub:v1";
var uid=function(){return Math.random().toString(36).slice(2,9)};
var seed=function(){
  var em1="Dear {{contact_name}},\n\nI'm {{my_name}}, {{my_role}} at {{my_company}}.\n\nWe would like to offer {{offering}} for {{institution}}. Would you be open to a quick call this week to discuss dates and format?\n\nRegards,\n{{my_name}}\n{{my_company}}";
  var e=uid(),w=uid();
  return {sel:{s:e,t:null},services:[
   {id:e,name:"Email",subject:true,templates:[
     {id:uid(),name:"General",general:true,subject:"{{offering}} for {{institution}}",body:em1},
     {id:uid(),name:"Colleges",subject:"Hands-on {{workshop_topic}} workshop for {{institution}} students",body:"Dear {{contact_name}} ({{designation}}),\n\nI'm {{my_name}}, {{my_role}} at {{my_company}}.\n\nWe run a {{duration}} hands-on workshop on {{workshop_topic}} for students with basic robotics knowledge. We'd be glad to host it for your {{department}} for around {{batch_size}} students.\n\nCould we have a quick 10-minute call this week to discuss dates and format?\n\nRegards,\n{{my_name}}\n{{my_company}}"},
     {id:uid(),name:"Industries",subject:"Autonomous robots for {{company_name}}",body:"Dear {{contact_name}},\n\nI'm {{my_name}}, {{my_role}} at {{my_company}}. We build {{product}} for {{use_case}}.\n\nI believe it could help {{company_name}} with {{pain_point}}. Could I show you a short demo?\n\nRegards,\n{{my_name}}\n{{my_company}}"}]},
   {id:w,name:"WhatsApp",subject:false,templates:[
     {id:uid(),name:"General",general:true,body:"Hi {{contact_name}}, this is {{my_name}} from {{my_company}}. {{message}}"},
     {id:uid(),name:"Follow-up",body:"Hi {{contact_name}}, following up on my mail about {{topic}}. Happy to share more details whenever suits you. - {{my_name}}"}]}
  ]};
};
var S,mine={},vals={},mode="use";
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);S=d.S;mine=d.mine||{}}}catch(e){}
  if(!S||!S.services)S=seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify({S:S,mine:mine}))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function svc(){return S.services.find(function(x){return x.id===S.sel.s})||S.services[0]}
function tpl(){var s=svc();if(!s)return null;return s.templates.find(function(x){return x.id===S.sel.t})||s.templates[0]}
function vars(t){var o=[],re=/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g,txt=(t.subject||"")+"\n"+t.body,m;while((m=re.exec(txt))){if(o.indexOf(m[1])<0)o.push(m[1])}return o}
function label(v){var s=v.replace(/^my_/,"my ").replace(/_/g," ");return s.charAt(0).toUpperCase()+s.slice(1)}
function val(v){return v in vals?vals[v]:(v.indexOf("my_")===0&&mine[v])||""}
function fill(txt,html){return txt.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g,function(_,v){var x=val(v);
  if(html)return x?"<mark>"+esc(x)+"</mark>":'<mark class="miss">'+esc(label(v))+"</mark>";
  return x||"{{"+v+"}}"})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast show";setTimeout(function(){t.className="toast"},1600)}

function ask(o){return new Promise(function(res){
  var m=document.getElementById("modal"),b=document.getElementById("mbox");
  b.innerHTML="<h3>"+esc(o.title)+"</h3>"+(o.text!==undefined?(o.area?'<textarea id="mi" style="min-height:140px">':'<input type="text" id="mi">')+(o.area?"</textarea>":""):"")+(o.msg?'<p class="hint" style="font-size:14px">'+esc(o.msg)+"</p>":"")+(o.check?'<label style="margin-top:10px;font-weight:500"><input type="checkbox" id="mc"> '+esc(o.check)+"</label>":"")+'<div class="acts" style="justify-content:flex-end"><button class="btn" id="mx">Cancel</button><button class="btn pri" id="mok">'+esc(o.ok||"Save")+"</button></div>";
  var i=document.getElementById("mi");if(i){i.value=o.text;if(o.ph)i.placeholder=o.ph;setTimeout(function(){i.focus()},30)}
  m.classList.add("open");
  function done(v){m.classList.remove("open");res(v)}
  document.getElementById("mx").onclick=function(){done(null)};
  document.getElementById("mok").onclick=function(){done({v:i?i.value.trim():true,c:!!(document.getElementById("mc")&&document.getElementById("mc").checked)})};
  if(i&&!o.area)i.onkeydown=function(e){if(e.key==="Enter")document.getElementById("mok").click();if(e.key==="Escape")done(null)};
})}

function render(){
  var s=svc();if(s)S.sel.s=s.id;
  var side=S.services.map(function(x){return '<button class="svc'+(x.id===S.sel.s?" on":"")+'" data-a="svc" data-id="'+x.id+'">'+esc(x.name)+"<small>"+x.templates.length+"</small></button>"}).join("");
  document.getElementById("svcs").innerHTML=side+'<button class="btn ghost" data-a="addsvc">+ Add service</button>';
  var M=document.getElementById("main");
  if(!s){M.innerHTML='<div class="empty">No services yet. Add one (Email, WhatsApp, LinkedIn, SMS...) to get started.</div>';return}
  var t=tpl();S.sel.t=t?t.id:null;
  var chips=s.templates.map(function(x){return '<button class="chip'+(x.id===S.sel.t?" on":"")+'" data-a="tpl" data-id="'+x.id+'">'+esc(x.name)+"</button>"}).join("");
  var h='<div class="bar">'+chips+'<button class="chip add" data-a="addtpl">+ New template</button></div>';
  if(!t){M.innerHTML=h+'<div class="empty">No templates in this service.</div>';return}
  h+='<div class="head"><h2>'+esc(s.name)+" / "+esc(t.name)+(t.general?'<span class="tag">general format</span>':"")+'</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><div class="seg"><button data-a="mode" data-m="use" class="'+(mode==="use"?"on":"")+'">Fill &amp; use</button><button data-a="mode" data-m="edit" class="'+(mode==="edit"?"on":"")+'">Edit template</button></div></div></div>';
  h+=mode==="use"?useView(s,t):editView(s,t);
  M.innerHTML=h;
}
function useView(s,t){
  var vs=vars(t);
  var f=vs.length?vs.map(function(v){return '<div class="fld"><label for="f_'+v+'">'+esc(label(v))+'</label><input type="text" id="f_'+v+'" data-v="'+v+'" value="'+esc(val(v))+'" autocomplete="off"></div>'}).join(""):'<p class="hint">This template has no blanks yet. Switch to Edit template and add some like {{name}}.</p>';
  var hasMine=vs.some(function(v){return v.indexOf("my_")===0});
  return '<div class="cols"><div class="card"><h3>Details</h3>'+f+(hasMine?'<p class="hint">Fields starting with “my” are remembered for next time.</p>':"")+'<div class="acts"><button class="btn sm" data-a="clear">Clear details</button></div></div>'+
  '<div class="card"><h3>Preview</h3><div class="pv" id="pv">'+pv(s,t)+'</div><div class="acts">'+(s.subject?'<button class="btn" data-a="copysub">Copy subject</button>':"")+'<button class="btn pri" data-a="copy">Copy '+(s.subject?"body":"message")+'</button><button class="btn" data-a="copyall">Copy all</button>'+(s.subject?'<button class="btn" data-a="mail">Open in mail app</button>':"")+(/whats/i.test(s.name)?'<button class="btn" data-a="wa">Open in WhatsApp</button>':"")+"</div></div></div>";
}
function pv(s,t){return (s.subject?'<div class="subj">'+fill(esc0(t.subject||""),true)+"</div>":"")+fill(esc0(t.body),true)}
function esc0(x){return esc(x)}
function editView(s,t){
  var vs=vars(t);
  return '<div class="cols"><div class="card"><h3>Template</h3><div class="fld"><label for="e_name">Template name</label><input type="text" id="e_name" value="'+esc(t.name)+'"></div>'+
  (s.subject?'<div class="fld"><label for="e_sub">Subject line</label><input type="text" id="e_sub" value="'+esc(t.subject||"")+'"></div>':"")+
  '<div class="fld"><label for="e_body">'+(s.subject?"Body":"Message")+'</label><textarea id="e_body">'+esc(t.body)+'</textarea><p class="hint">Write {{blank_name}} wherever you want a box to fill in, e.g. {{contact_name}}. Use my_ at the start (like {{my_name}}) for details that should be remembered.</p></div></div>'+
  '<div class="card"><h3>Blanks in this template</h3><div class="vars" id="vlist">'+vlist(vs)+'</div><div class="row"><input type="text" id="newvar" placeholder="New blank, e.g. designation"><button class="btn" data-a="insvar">Insert</button></div><p class="hint">Click a blank to insert it at the cursor.</p>'+
  '<div class="acts" style="margin-top:22px">'+(t.general?'<span class="hint">The general template is the starting point copied into every new template.</span>':'<button class="btn" data-a="makegen">Set as general</button>')+'<button class="btn" data-a="dup">Duplicate</button>'+(t.general?"":'<button class="btn bad" data-a="deltpl">Delete template</button>')+'</div>'+
  '<div class="acts"><button class="btn sm" data-a="rensvc">Rename service</button><button class="btn sm bad" data-a="delsvc">Delete service</button></div></div></div>';
}
function vlist(vs){return vs.length?vs.map(function(v){return '<button data-a="ins" data-v="'+v+'">'+esc(label(v))+"</button>"}).join(""):'<span class="hint">No blanks yet.</span>'}
function insertAtCursor(txt){var ta=document.getElementById("e_body"),a=ta.selectionStart,b=ta.selectionEnd;ta.value=ta.value.slice(0,a)+txt+ta.value.slice(b);ta.focus();ta.selectionStart=ta.selectionEnd=a+txt.length;sync()}
function sync(){var t=tpl();if(!t)return;var n=document.getElementById("e_name"),su=document.getElementById("e_sub"),b=document.getElementById("e_body");
  if(n)t.name=n.value||"Untitled";if(su)t.subject=su.value;if(b)t.body=b.value;save();var l=document.getElementById("vlist");if(l)l.innerHTML=vlist(vars(t))}
function cp(txt,msg){var done=function(){toast(msg||"Copied")};
  try{navigator.clipboard.writeText(txt).then(done,function(){fb(txt);done()})}catch(e){fb(txt);done()}}
function fb(txt){var a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()}

document.addEventListener("input",function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.v){vals[el.dataset.v]=el.value;if(el.dataset.v.indexOf("my_")===0){mine[el.dataset.v]=el.value;save()}
    var p=document.getElementById("pv");if(p)p.innerHTML=pv(svc(),tpl())}
  else if(/^e_/.test(el.id))sync();
});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,s=svc(),t=tpl();
  if(a==="svc"){S.sel.s=b.dataset.id;S.sel.t=null;mode="use";save();render()}
  else if(a==="tpl"){S.sel.t=b.dataset.id;save();render()}
  else if(a==="mode"){mode=b.dataset.m;render()}
  else if(a==="clear"){vals={};render()}
  else if(a==="addsvc")ask({title:"Add a service",text:"",ph:"e.g. LinkedIn, SMS, Email",check:"Has a subject line (like email)"}).then(function(r){if(!r||!r.v)return;var id=uid();S.services.push({id:id,name:r.v,subject:r.c,templates:[{id:uid(),name:"General",general:true,subject:r.c?"{{subject}}":undefined,body:"Hi {{contact_name}},\n\n{{message}}\n\n{{my_name}}"}]});S.sel={s:id,t:null};mode="edit";save();render()});
  else if(a==="addtpl")ask({title:"New template in "+s.name,text:"",ph:"e.g. Startups, Alumni, Government"}).then(function(r){if(!r||!r.v)return;var g=s.templates.find(function(x){return x.general})||s.templates[0],id=uid();s.templates.push({id:id,name:r.v,subject:g?g.subject:"",body:g?g.body:""});S.sel.t=id;mode="edit";save();render()});
  else if(a==="dup"){var id=uid();s.templates.push({id:id,name:t.name+" copy",subject:t.subject,body:t.body});S.sel.t=id;save();render()}
  else if(a==="makegen"){s.templates.forEach(function(x){x.general=x===t});save();render()}
  else if(a==="deltpl")ask({title:"Delete “"+t.name+"”?",msg:"This can't be undone.",ok:"Delete"}).then(function(r){if(!r)return;s.templates=s.templates.filter(function(x){return x!==t});S.sel.t=null;mode="use";save();render()});
  else if(a==="delsvc")ask({title:"Delete “"+s.name+"” and all its templates?",msg:"This can't be undone.",ok:"Delete"}).then(function(r){if(!r)return;S.services=S.services.filter(function(x){return x!==s});S.sel={s:null,t:null};save();render()});
  else if(a==="rensvc")ask({title:"Rename service",text:s.name}).then(function(r){if(!r||!r.v)return;s.name=r.v;save();render()});
  else if(a==="ins"){insertAtCursor("{{"+b.dataset.v+"}}")}
  else if(a==="insvar"){var i=document.getElementById("newvar"),v=i.value.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");if(!v)return;insertAtCursor("{{"+v+"}}");i.value=""}
  else if(a==="copy")cp(fill(t.body,false),"Copied");
  else if(a==="copysub")cp(fill(t.subject||"",false),"Subject copied");
  else if(a==="copyall")cp((s.subject?fill(t.subject||"",false)+"\n\n":"")+fill(t.body,false),"Copied");
  else if(a==="mail"){window.open("mailto:?subject="+encodeURIComponent(fill(t.subject||"",false))+"&body="+encodeURIComponent(fill(t.body,false)),"_blank")}
  else if(a==="wa"){window.open("https://wa.me/?text="+encodeURIComponent(fill(t.body,false)),"_blank")}
  else if(a==="backup"){cp(JSON.stringify({S:S,mine:mine}),"Backup copied. Paste it somewhere safe")}
  else if(a==="restore")ask({title:"Restore from backup",text:"",area:true,ph:"Paste backup text here",ok:"Restore",msg:"This replaces everything currently saved."}).then(function(r){if(!r||!r.v)return;try{var d=JSON.parse(r.v);if(!d.S||!d.S.services)throw 0;S=d.S;mine=d.mine||{};save();render();toast("Restored")}catch(x){toast("That backup isn't valid")}});
});
load();render();
})();
</script>
</body>
</html>
